name: CI

on:
  push:
    branches: [main, "claude/**"]
    # Doc-only changes don't need the full matrix.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# Least-privilege: the workflow only reads the repo. The previous
# `issues: write` + `actions: write` + `pull-requests: write` block
# existed for an opt-in PR-comment-on-failure flow that we've
# removed (failures are now surfaced via the standard Checks tab).
permissions:
  contents: read

# Cancel obsolete runs on the same ref (typical force-push during
# dev). Group by PR number when available so different PRs don't
# starve each other; fall back to ref_name on direct pushes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  # Pin LDC so cache keys + reproducibility don't drift with upstream.
  LDC_VERSION: 1.42.0

jobs:
  # ── Build matrix (engine × OS) ──────────────────────────────────
  build:
    name: ${{ matrix.engine }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # QuickJS: Linux + macOS + Windows.
          - { os: ubuntu-latest,  engine: quickjs }
          - { os: macos-latest,   engine: quickjs }
          - { os: windows-latest, engine: quickjs }
          # JSC: prebuilt or system library (Linux + macOS).
          - { os: ubuntu-latest, engine: jsc }
          - { os: macos-latest,  engine: jsc }
          # V8: via C++ shim (Linux only — needs LDC's internal
          # linker for CREL relocations).
          - { os: ubuntu-latest, engine: v8 }

    steps:
      - uses: actions/checkout@v6

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-${{ env.LDC_VERSION }}

      - name: Install system deps (JSC · Linux)
        if: matrix.engine == 'jsc' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libjavascriptcoregtk-4.1-dev

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Install CMake
        if: matrix.engine == 'quickjs'
        uses: lukka/get-cmake@latest

      # Cache key includes LDC version + a checksum of the build
      # scripts; bump either and the cache is rebuilt.
      - name: Cache vendor
        uses: actions/cache@v5
        with:
          path: vendor/
          key: vendor-${{ matrix.engine }}-${{ matrix.os }}-ldc${{ env.LDC_VERSION }}-${{ hashFiles('build.d', 'dub.json') }}
          restore-keys: |
            vendor-${{ matrix.engine }}-${{ matrix.os }}-ldc${{ env.LDC_VERSION }}-
            vendor-${{ matrix.engine }}-${{ matrix.os }}-

      - name: Build vendor deps
        shell: bash
        run: ldc2 -run build.d --backend=${{ matrix.engine }} --verbose

      - name: Build (debug)
        if: matrix.engine != 'v8'
        shell: bash
        run: dub build -v -c ${{ matrix.engine }}

      # V8 link step needs --link-internally (CREL relocations) which
      # only works on Linux with LDC's bundled lld. The compile-check
      # path here verifies the D source compiles; full link is
      # exercised by the release job.
      - name: Compile check (V8)
        if: matrix.engine == 'v8'
        shell: bash
        run: |
          if output=$(dub build -v -c v8 2>&1); then
            exit 0
          fi
          if echo "$output" | grep -q 'cannot find -lv8'; then
            echo "D compilation OK — link skipped (no system libv8)"
            exit 0
          fi
          echo "$output"
          exit 1

      - name: Build (release)
        if: matrix.engine != 'v8'
        shell: bash
        run: dub build -v -c ${{ matrix.engine }} -b release

      - name: Upload binary
        if: matrix.engine != 'v8'
        uses: actions/upload-artifact@v7
        with:
          name: dun-${{ matrix.engine }}-${{ matrix.os }}
          path: build/dun${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7

  # ── Unit tests ────────────────────────────────────────────────
  test:
    name: Test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-${{ env.LDC_VERSION }}

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - uses: lukka/get-cmake@latest

      - name: Cache vendor
        uses: actions/cache@v5
        with:
          path: vendor/
          key: vendor-quickjs-${{ matrix.os }}-ldc${{ env.LDC_VERSION }}-${{ hashFiles('build.d', 'dub.json') }}
          restore-keys: |
            vendor-quickjs-${{ matrix.os }}-ldc${{ env.LDC_VERSION }}-
            vendor-quickjs-${{ matrix.os }}-

      - name: Build vendor deps
        shell: bash
        run: ldc2 -run build.d --backend=quickjs --verbose

      - name: Run unit tests
        shell: bash
        run: dub test -v -c unittest

  # ── Integration tests ─────────────────────────────────────────
  integration:
    name: Integration · ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: dun-quickjs-${{ matrix.os }}
          path: build/

      - name: Run integration tests (POSIX)
        if: runner.os != 'Windows'
        run: |
          chmod +x build/dun
          DUN=./build/dun bash tests/integration/run.sh

      # Windows path mirrors run.sh; bash on a Windows runner via
      # Git Bash handles the test script directly.
      - name: Run integration tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          DUN=./build/dun.exe bash tests/integration/run.sh
