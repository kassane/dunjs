name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build matrix (engine × OS) ──────────────────────────────────
  build:
    name: ${{ matrix.engine }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # QuickJS: Linux + macOS + Windows
          - { os: ubuntu-latest,  engine: quickjs }
          - { os: macos-latest,       engine: quickjs }
          - { os: windows-latest, engine: quickjs }
          # JSC: system library (Linux + macOS only)
          - { os: ubuntu-latest, engine: jsc }
          - { os: macos-latest,      engine: jsc }
          # V8: via C++ shim (best-effort)
          - { os: ubuntu-latest, engine: v8 }

    steps:
      - uses: actions/checkout@v4

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Install system deps (JSC · Linux)
        if: matrix.engine == 'jsc' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libjavascriptcoregtk-4.1-dev

      - name: Install system deps (V8 · Linux)
        if: matrix.engine == 'v8' && runner.os == 'Linux'
        run: echo "V8 headers vendored from Node.js — no system packages needed"

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake
        if: matrix.engine == 'quickjs'
        uses: lukka/get-cmake@latest

      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: vendor/
          key: vendor-${{ matrix.engine }}-${{ matrix.os }}-${{ hashFiles('build.d', 'dub.json') }}
          restore-keys: vendor-${{ matrix.engine }}-${{ matrix.os }}-

      - name: Build vendor deps
        run: ldc2 -run build.d --backend=${{ matrix.engine }} --verbose

      - name: Verify vendor (Windows)
        if: runner.os == 'Windows' && matrix.engine == 'quickjs'
        shell: pwsh
        run: |
          Write-Host "=== vendor/quickjs/build contents ==="
          if (Test-Path vendor/quickjs/build) {
            Get-ChildItem vendor/quickjs/build -Recurse | ForEach-Object {
              Write-Host "$($_.FullName) ($($_.Length) bytes)"
            }
          } else {
            Write-Host "ERROR: vendor/quickjs/build does not exist!"
            exit 1
          }
          Write-Host "=== LDC version ==="
          ldc2 --version | Select-Object -First 3
          Write-Host "=== DUB version ==="
          dub --version

      - name: Build (debug)
        if: matrix.engine != 'v8'
        run: dub build -v -c ${{ matrix.engine }}

      - name: Compile check (V8)
        if: matrix.engine == 'v8'
        run: |
          # V8 linking requires system libv8 which isn't available on CI.
          # Verify D compilation succeeds; only the expected link failure is tolerated.
          output=$(dub build -v -c v8 2>&1) && exit 0
          if echo "$output" | grep -q 'cannot find -lv8'; then
            echo "D compilation OK — link skipped (no system libv8)"
          else
            echo "$output"
            exit 1
          fi

      - name: Build (release)
        if: matrix.engine != 'v8'
        run: dub build -v -c ${{ matrix.engine }} -b release

      - name: Upload binary (POSIX)
        if: matrix.engine != 'v8' && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dun-${{ matrix.engine }}-${{ matrix.os }}
          path: build/dun
          retention-days: 7

      - name: Upload binary (Windows)
        if: matrix.engine != 'v8' && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dun-${{ matrix.engine }}-${{ matrix.os }}
          path: build/dun.exe
          retention-days: 7

      - name: Post failure logs to PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const job = '${{ matrix.engine }} · ${{ matrix.os }}';
            // Get this job's logs via the API
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const thisJob = jobs.data.jobs.find(j => j.name === job);
            let body = `**CI failed**: \`${job}\`\n\n`;
            if (thisJob) {
              const failedSteps = thisJob.steps.filter(s => s.conclusion === 'failure');
              body += `**Failed steps**: ${failedSteps.map(s => s.name).join(', ')}\n\n`;
              // Get full logs
              try {
                const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: thisJob.id,
                });
                let logText = typeof logs.data === 'string' ? logs.data : Buffer.from(logs.data).toString('utf8');
                // Get last 3000 chars
                if (logText.length > 3000) logText = '...(truncated)\n' + logText.slice(-3000);
                body += `\`\`\`\n${logText}\n\`\`\``;
              } catch(e) {
                body += `Could not fetch logs: ${e.message}`;
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

  # ── Unit tests ────────────────────────────────────────────────
  test:
    name: Test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest }
          - { os: macos-latest }
          - { os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: lukka/get-cmake@latest

      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: vendor/
          key: vendor-quickjs-${{ matrix.os }}-${{ hashFiles('build.d', 'dub.json') }}
          restore-keys: vendor-quickjs-${{ matrix.os }}-

      - name: Build vendor deps
        run: ldc2 -run build.d --backend=quickjs --verbose

      - name: Run unit tests
        run: dub test -v -c unittest

  # ── Integration tests ─────────────────────────────────────────
  integration:
    name: Integration · ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest }
          - { os: macos-latest }
          - { os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: dun-quickjs-${{ matrix.os }}
          path: build/

      - name: Run integration tests (POSIX)
        if: runner.os != 'Windows'
        run: |
          chmod +x build/dun
          pass=0 fail=0 skip=0
          for fixture in tests/integration/fixtures/*.js; do
            name=$(basename "$fixture" .js)
            expected="tests/integration/expected/${name}.txt"
            if [ ! -f "$expected" ]; then
              echo "SKIP $name"
              skip=$((skip + 1))
              continue
            fi
            if output=$(./build/dun run "$fixture" 2>&1) && \
               diff -u "$expected" <(printf '%s\n' "$output") >/dev/null 2>&1; then
              echo "PASS $name"
              pass=$((pass + 1))
            else
              echo "FAIL $name"
              diff -u "$expected" <(printf '%s\n' "$output") || true
              fail=$((fail + 1))
            fi
          done
          echo ""
          echo "Results: $pass passed, $fail failed, $skip skipped"
          [ "$fail" -eq 0 ]

      - name: Run integration tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pass = 0; $fail = 0; $skip = 0
          foreach ($fixture in Get-ChildItem tests/integration/fixtures/*.js) {
            $name = $fixture.BaseName
            $expected = "tests/integration/expected/${name}.txt"
            if (-not (Test-Path $expected)) {
              Write-Host "SKIP $name"
              $skip++
              continue
            }
            $expectedContent = (Get-Content $expected -Raw).TrimEnd()
            $output = (& build/dun.exe run $fixture.FullName 2>&1) | Out-String
            $output = $output.TrimEnd()
            if ($output -eq $expectedContent) {
              Write-Host "PASS $name"
              $pass++
            } else {
              Write-Host "FAIL $name"
              Write-Host "Expected:"
              Write-Host $expectedContent
              Write-Host "Got:"
              Write-Host $output
              $fail++
            }
          }
          Write-Host ""
          Write-Host "Results: $pass passed, $fail failed, $skip skipped"
          if ($fail -gt 0) { exit 1 }
